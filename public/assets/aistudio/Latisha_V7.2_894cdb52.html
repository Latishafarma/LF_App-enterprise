        // 2. POS CASHIER VIEW (TERBENTUK KEMBALI SECARA PRESISI & BEBAS KACAU)
        function POSCashierView({ medicines, setMedicines, patients, doctors, transactions, setTransactions, addAuditLog, activePrescriptionForPOS, setActivePrescriptionForPOS, setStockMutations, stockMutations }) {
            const [posJalur, setPosJalur] = useState('REGULER'); 
            const [customer, setCustomer] = useState('Regular');
            const [doctor, setDoctor] = useState('Internal');

            const [pluInput, setPluInput] = useState('');
            const [selectedMed, setSelectedMed] = useState(null);
            const [tuslah, setTuslah] = useState(0);
            const [qty, setQty] = useState(1);
            const [unit, setUnit] = useState('');
            const [choosePrice, setChoosePrice] = useState('Harga Jual 1');
            const [price, setPrice] = useState(0);
            const [itemDiscount, setItemDiscount] = useState(0);

            const [cart, setCart] = useState([]);
            const [description, setDescription] = useState('');
            const [invoiceNo, setInvoiceNo] = useState(`INV-${Date.now().toString().slice(-6)}`);
            const [overallDiscount, setOverallDiscount] = useState(0);
            const [chargeCC, setChargeCC] = useState(0);

            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [paymentMethod, setPaymentMethod] = useState('Tunai');
            const [subMethod, setSubMethod] = useState('Tunai');
            const [payAmount, setPayAmount] = useState(0);

            // RESOLVER HARGA DINAMIS (MENGAKOMODASI MASTER PRICE, HARGA MITRA, HARGA KLINIK & KONVERSI)
            const resolveDynamicPrice = (med, priceType, targetUnit) => {
                if (!med) return 0;
                
                const rasio = Number(med.rasioKonversi) || Number(med.konversi) || 1;
                const hnaBesar = Number(med.hnaBesar || med.hna) || 0;
                
                const isBesar = targetUnit && med.satuanBesar && (targetUnit.trim().toLowerCase() === med.satuanBesar.trim().toLowerCase());
                
                const hppBesar = Math.round(hnaBesar * 1.11);
                const hppKecil = rasio > 0 ? Math.round(hppBesar / rasio) : hppBesar;
                
                const salesPriceBesarDasar = Math.round(hppBesar + (hppBesar * ((med.markupPercent || 100) / 100)));
                const salesPriceKecilDasar = Number(med.sellPrice) || (rasio > 0 ? Math.round(salesPriceBesarDasar / rasio) : salesPriceBesarDasar);

                if (priceType === 'Harga Jual 3') {
                    // JALUR MITRA
                    const defaultMitraKecil = Number(med.sellPriceMitra || med.harga_mitra) || Math.round(salesPriceKecilDasar * 0.90);
                    const defaultMitraBesar = Number(med.sellPriceMitraBesar) || Math.round(salesPriceBesarDasar * 0.90);
                    return isBesar ? defaultMitraBesar : defaultMitraKecil;
                } else if (priceType === 'Harga Jual 2') {
                    // JALUR KLINIK / RESEP
                    const defaultKlinikKecil = Number(med.sellPriceKlinik || med.harga_klinik) || Math.round(salesPriceKecilDasar * 0.95);
                    const defaultKlinikBesar = Number(med.sellPriceKlinikBesar) || Math.round(salesPriceBesarDasar * 0.95);
                    return isBesar ? defaultKlinikBesar : defaultKlinikKecil;
                } else {
                    // JALUR REGULER / OTC
                    return isBesar ? (Number(med.sellPriceBesar) || salesPriceBesarDasar) : salesPriceKecilDasar;
                }
            };

            // AUTO SWITCH OPS HARGA SESUAI JALUR POS
            useEffect(() => {
                let targetPriceType = 'Harga Jual 1';
                if (posJalur === 'MITRA') targetPriceType = 'Harga Jual 3';
                else if (posJalur === 'RESEP') targetPriceType = 'Harga Jual 2';
                
                setChoosePrice(targetPriceType);
                if (selectedMed) {
                    const activeUnit = unit || selectedMed.satuanKecil || selectedMed.unit || 'Strip';
                    setPrice(resolveDynamicPrice(selectedMed, targetPriceType, activeUnit));
                }
            }, [posJalur]);

            // DUKUNGAN RESEP MASUK DARI E-PRESCRIPTION QUEUE
            useEffect(() => {
                if (activePrescriptionForPOS) {
                    setPosJalur('RESEP');
                    setCustomer(activePrescriptionForPOS.patientName || 'Regular');
                    setDoctor(activePrescriptionForPOS.doctorName || 'Internal');
                    
                    const loadedCart = activePrescriptionForPOS.items.map((it, i) => {
                        const med = medicines.find(m => m.name.toLowerCase().includes(it.name.toLowerCase())) || medicines[0];
                        const defaultUnit = med ? (med.satuanKecil || med.unit || 'Strip') : 'Strip';
                        const selectedPrice = med ? resolveDynamicPrice(med, 'Harga Jual 2', it.unit || defaultUnit) : 5000;
                        return {
                            id: med ? med.id : `OBT-${i}`,
                            name: it.name,
                            qty: Number(it.qty) || 1,
                            unit: it.unit || defaultUnit,
                            tuslah: 0,
                            price: selectedPrice,
                            discount: 0,
                            subtotal: selectedPrice * (Number(it.qty) || 1),
                            hpp: med ? (med.hpp || 3000) : 3000
                        };
                    });
                    setCart(loadedCart);
                }
            }, [activePrescriptionForPOS]);

            const handleMedSelect = (med) => {
                setSelectedMed(med);
                setPluInput(med.name);
                const defaultUnit = med.satuanKecil || med.unit || 'Strip';
                setUnit(defaultUnit);
                setPrice(resolveDynamicPrice(med, choosePrice, defaultUnit));
            };

            const handleChoosePriceChange = (val) => {
                setChoosePrice(val);
                if (selectedMed) {
                    const activeUnit = unit || selectedMed.satuanKecil || selectedMed.unit || 'Strip';
                    setPrice(resolveDynamicPrice(selectedMed, val, activeUnit));
                }
            };

            const handleUnitChange = (newUnit) => {
                setUnit(newUnit);
                if (selectedMed) {
                    setPrice(resolveDynamicPrice(selectedMed, choosePrice, newUnit));
                }
            };

            const computedSubtotalInput = useMemo(() => {
                return Math.max(0, (Number(price) * Number(qty)) + Number(tuslah) - Number(itemDiscount));
            }, [price, qty, tuslah, itemDiscount]);

            const handleAddItem = () => {
                if (!selectedMed && !pluInput) {
                    alert("Pilih atau ketik nama obat terlebih dahulu!");
                    return;
                }
                const med = selectedMed || medicines.find(m => m.name.toLowerCase().includes(pluInput.toLowerCase())) || medicines[0];
                const fallbackUnit = unit || med.satuanKecil || med.unit || 'Strip';
                const finalPrice = price > 0 ? price : resolveDynamicPrice(med, choosePrice, fallbackUnit);
                
                const newItem = {
                    id: med.id,
                    name: med.name,
                    qty: Number(qty) || 1,
                    unit: fallbackUnit,
                    tuslah: Number(tuslah) || 0,
                    price: Number(finalPrice) || 0,
                    discount: Number(itemDiscount) || 0,
                    subtotal: Math.max(0, (finalPrice * (Number(qty) || 1)) + Number(tuslah) - Number(itemDiscount)),
                    hpp: med.hpp || 0
                };
                
                setCart(prev => [...prev, newItem]);
                
                // Reset input baris
                setPluInput('');
                setSelectedMed(null);
                setTuslah(0);
                setQty(1);
                setPrice(0);
                setItemDiscount(0);
            };

            const handleRemoveItem = (idx) => setCart(prev => prev.filter((_, i) => i !== idx));

            const cartSubtotal = cart.reduce((acc, i) => acc + i.subtotal, 0);
            const totalAfterDiscount = Math.max(0, cartSubtotal - Number(overallDiscount));
            const grandTotal = totalAfterDiscount + Number(chargeCC);
            const totalItemsCount = cart.reduce((acc, i) => acc + i.qty, 0);
            const change = Math.max(0, payAmount - grandTotal);

            const handleSaveTransaction = () => {
                if (cart.length === 0) {
                    alert("Keranjang belanja masih kosong!");
                    return;
                }
                if (payAmount < grandTotal && paymentMethod !== 'Kredit / Debit') {
                    alert("Nominal pembayaran kurang dari total tagihan!");
                    return;
                }

                const newTrxId = invoiceNo || `TRX-${Date.now().toString().slice(-6)}`;
                const newTrx = {
                    id: newTrxId,
                    date: new Date().toLocaleString('id-ID'),
                    type: posJalur,
                    kasir: 'apt. Mardin, S.Farm',
                    customerName: customer,
                    doctorName: doctor,
                    subtotal: cartSubtotal,
                    discount: Number(overallDiscount),
                    chargeCC: Number(chargeCC),
                    total: grandTotal,
                    payAmount: Number(payAmount),
                    change,
                    paymentMethod: `${paymentMethod} (${subMethod})`,
                    description,
                    items: cart
                };

                const updatedMedicines = medicines.map(m => {
                    const match = cart.find(c => c.id === m.id);
                    if (match) return { ...m, stock: Math.max(0, m.stock - match.qty) };
                    return m;
                });

                const newMutations = cart.map(c => ({
                    id: `MUT-${Date.now()}-${Math.random()}`,
                    date: new Date().toISOString().split('T')[0],
                    medicineId: c.id,
                    refNo: newTrxId,
                    type: 'PENJUALAN',
                    inQty: 0,
                    outQty: c.qty,
                    balance: Math.max(0, (medicines.find(m => m.id === c.id)?.stock || 0) - c.qty),
                    ket: `Penjualan POS Jalur ${posJalur} (${customer})`,
                    petugas: 'apt. Mardin'
                }));

                setMedicines(updatedMedicines);
                setStockMutations(prev => [...newMutations, ...prev]);
                setTransactions(prev => [newTrx, ...prev]);
                addAuditLog('POS Kasir', `Transaksi #${newTrx.id} senilai Rp ${grandTotal.toLocaleString()} terbayar`);
                
                setShowPaymentModal(false);
                setCart([]);
                setActivePrescriptionForPOS(null);
                setInvoiceNo(`INV-${Date.now().toString().slice(-6)}`);
                setPayAmount(0);
                setOverallDiscount(0);
                setDescription('');
                alert(`Transaksi #${newTrx.id} berhasil disimpan!`);
            };

            return (
                <div className="bg-white rounded-2xl border border-slate-300 shadow-sm flex flex-col h-[85vh] text-xs font-sans select-none overflow-hidden">
                    {/* TOP CONTROL PANEL */}
                    <div className="p-3.5 border-b border-slate-200 bg-slate-50 space-y-3">
                        <div className="flex flex-wrap items-center justify-between border-b border-slate-200 pb-2.5 gap-2">
                            <div className="flex items-center gap-2">
                                <span className="font-black text-slate-700 text-xs uppercase tracking-wider mr-1">
                                    <i className="fa-solid fa-route mr-1.5 text-indigo-600"></i> Jalur Transaksi:
                                </span>

        // 3. E-PRESCRIPTION QUEUE (Dengan Skrining Standar, Penolakan & Supabase Sync)
        function EPrescriptionQueueView({ ePrescriptions, setEPrescriptions, setActiveTab, setActivePrescriptionForPOS }) {
            const [screeningData, setScreeningData] = useState({});
            
            const [rejectModalOpen, setRejectModalOpen] = useState(false);
            const [selectedPres, setSelectedPres] = useState(null);
            const [rejectReason, setRejectReason] = useState('Dosis obat tidak sesuai / melebihi batas maksimal');

            useEffect(() => {
                async function fetchResepFromSupabase() {
                    if (!supabaseClient) return;
                    try {
                        const { data, error } = await supabaseClient.from('e_prescriptions').select('*');
                        if (error) throw error;
                        if (data && data.length > 0) {
                            const mappedRx = data.map(rx => ({
                                id: rx.id || rx.kode_resep || 'RX-SUPABASE',
                                rmId: rx.rm_id || 'RM-001',
                                patientName: rx.patient_name || rx.nama_pasien || 'Pasien',
                                doctorName: rx.doctor_name || rx.nama_dokter || 'Dokter',
                                items: typeof rx.items === 'string' ? JSON.parse(rx.items) : (rx.items || []),
                                status: rx.status || 'Pending Skrining',
                                timestamp: rx.timestamp || new Date().toLocaleTimeString(),
                                screeningNotes: rx.screening_notes || rx.screeningNotes || ''
                            }));
                            setEPrescriptions(mappedRx);
                        }
                    } catch (err) {
                        console.error("Gagal memuat data e_prescriptions dari Supabase:", err.message);
                    }
                }
                fetchResepFromSupabase();
            }, []);

            const handleCheckboxChange = (presId, category, field) => {
                setScreeningData(prev => {
                    const currentPresScreening = prev[presId] || {
                        admin: { namaDokter: true, sip: true, tglResep: true, paraf: true },
                        farmasetik: { bentukSediaan: true, dosis: true, stabilitas: true, kompatibilitas: true },
                        klinis: { tepatDosis: true, tepatWaktu: true, kontraIndikasi: true, interaksi: true }
                    };

                    return {
                        ...prev,
                        [presId]: {
                            ...currentPresScreening,
                            [category]: {
                                ...currentPresScreening[category],
                                [field]: !currentPresScreening[category][field]
                            }
                        }
                    };
                });
            };

            const handleApprovePrescription = async (rx) => {
                const updatedStatus = 'Selesai / Terkirim ke POS';
                const notes = 'Lolos Skrining Administratif, Farmasetik & Klinis';

                const updatedList = ePrescriptions.map(item => {
                    if (item.id === rx.id) {
                        return { ...item, status: updatedStatus, screeningNotes: notes };
                    }
                    return item;
                });

                setEPrescriptions(updatedList);

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('e_prescriptions').upsert([{
                            id: rx.id,
                            patient_name: rx.patientName,
                            doctor_name: rx.doctorName,
                            status: updatedStatus,
                            screening_notes: notes,
                            items: JSON.stringify(rx.items)
                        }]);
                    } catch (err) {
                        console.error("Gagal memperbarui status resep ke Supabase:", err.message);
                    }
                }

                setActivePrescriptionForPOS(rx);
                setActiveTab('pos-kasir');
            };

            const handleOpenRejectModal = (rx) => {
                setSelectedPres(rx);
                setRejectModalOpen(true);
            };

            const handleConfirmReject = async () => {
                if (!selectedPres) return;

                const updatedStatus = 'Ditolak / Tidak Memenuhi Syarat';
                const notes = `Ditolak: ${rejectReason}`;

                const updatedList = ePrescriptions.map(item => {
                    if (item.id === selectedPres.id) {
                        return { ...item, status: updatedStatus, screeningNotes: notes };
                    }
                    return item;
                });

                setEPrescriptions(updatedList);

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('e_prescriptions').upsert([{
                            id: selectedPres.id,
                            patient_name: selectedPres.patientName,
                            doctor_name: selectedPres.doctorName,
                            status: updatedStatus,
                            screening_notes: notes,
                            items: JSON.stringify(selectedPres.items)
                        }]);
                    } catch (err) {
                        console.error("Gagal memperbarui status penolakan resep ke Supabase:", err.message);
                    }
                }

                setRejectModalOpen(false);
                setSelectedPres(null);
            };

            return (
                <div className="space-y-4 text-xs">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center">
                        <div>
                            <h3 className="font-black text-slate-800 text-sm">E-Prescription Queue & Skrining Standar (Supabase Sync)</h3>
                            <p className="text-[10px] text-slate-500 mt-0.5">Antrian resep elektronik dokter lengkap dengan checklist administratif, farmasetik, dan klinis.</p>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {ePrescriptions.map(rx => {
                            const presScreening = screeningData[rx.id] || {
                                admin: { namaDokter: true, sip: true, tglResep: true, paraf: true },
                                farmasetik: { bentukSediaan: true, dosis: true, stabilitas: true, kompatibilitas: true },
                                klinis: { tepatDosis: true, tepatWaktu: true, kontraIndikasi: true, interaksi: true }
                            };

                            return (
                                <div key={rx.id} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-3 gap-2">
                                        <div>
                                            <span className="font-mono font-black text-indigo-700 text-sm">{rx.id}</span>
                                            <span className="ml-2 text-slate-500 text-[11px]">Waktu Masuk: {rx.timestamp}</span>
                                            <h4 className="font-bold text-slate-800 mt-0.5">Pasien: {rx.patientName} (RM: {rx.rmId}) | Dokter: {rx.doctorName}</h4>
                                        </div>
                                        <div>
                                            <span className={`px-3 py-1 rounded-full font-black text-[10px] ${
                                                rx.status === 'Pending Skrining' ? 'bg-amber-100 text-amber-800 animate-pulse' : 
                                                rx.status.includes('Selesai') ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                                            }`}>
                                                {rx.status}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                        {/* 1. ADMINISTRATIF */}
                                        <div className="p-3 bg-slate-50 border rounded-xl space-y-1.5">
                                            <h5 className="font-black text-slate-700 text-[10px] uppercase border-b pb-1">1. Skrining Administratif</h5>
                                            {Object.keys(presScreening.admin).map(field => (
                                                <label key={field} className="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={presScreening.admin[field]} 
                                                        onChange={() => handleCheckboxChange(rx.id, 'admin', field)}
                                                        className="w-3.5 h-3.5 text-indigo-600 rounded" 
                                                    />
                                                    <span className="capitalize">{field.replace(/([A-Z])/g, ' $1')}</span>
                                                </label>
                                            ))}
                                        </div>

                                        {/* 2. FARMASETIK */}
                                        <div className="p-3 bg-slate-50 border rounded-xl space-y-1.5">

        // 3.2. PEMBELIAN & FAKTUR PBF VIEW
        function PurchaseInvoiceView({ purchaseInvoices, setPurchaseInvoices, medicines, setMedicines, addAuditLog }) {
            const [searchQuery, setSearchQuery] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);

            const [suppliersList, setSuppliersList] = useState([]);
            const [masterPriceList, setMasterPriceList] = useState(medicines || []);

            useEffect(() => {
                async function fetchPurchaseModuleData() {
                    if (!supabaseClient) return;
                    try {
                        const { data: supData } = await supabaseClient.from('supplier').select('*');
                        if (supData && supData.length > 0) {
                            setSuppliersList(supData.map(s => ({
                                id: s.id || Math.random().toString(),
                                name: s.nama_supplier || s.supplier_nama || s.name || 'Supplier PBF'
                            })));
                        }

                        const { data: priceData } = await supabaseClient.from('master_price').select('*');
                        if (priceData && priceData.length > 0) {
                            const mappedPrices = priceData.map(p => ({
                                id: p.id || Math.random().toString(),
                                name: p.nama_obat || p.name || 'Obat',
                                satuanKecil: p.satuan_kecil || p.unit || 'Box',
                                satuanBesar: p.satuan_besar || p.satuanBesar || '',
                                hpp: Number(p.hpp || p.price) || 0,
                                hargaBesar: Number(p.harga_besar || p.hargaBesar || p.hna_besar || 0) || 0,
                                konversi: Number(p.konversi || p.isi || 1) || 1,
                                stock: Number(p.stock || p.stok) || 0
                            }));
                            setMasterPriceList(mappedPrices);
                        }

                        const { data: invData } = await supabaseClient.from('purchase_invoices').select('*');
                        if (invData && invData.length > 0) {
                            setPurchaseInvoices(invData.map(inv => ({
                                id: inv.id || 'INV-SUPABASE',
                                pbfName: inv.pbf_name || '',
                                invoiceNo: inv.invoice_no || '',
                                date: inv.tanggal_faktur || inv.date || new Date().toISOString().split('T')[0],
                                dueDate: inv.tanggal_tempo || inv.due_date || '',
                                salesman: inv.salesman || '',
                                term: inv.term || '30 Hari',
                                usePpn: inv.use_ppn !== undefined ? inv.use_ppn : true,
                                items: typeof inv.items === 'string' ? JSON.parse(inv.items) : (inv.items || []),
                                dpp: Number(inv.dpp) || 0,
                                grossDpp: Number(inv.gross_dpp) || 0,
                                totalDiscountAmount: Number(inv.total_discount_amount) || 0,
                                ppn: Number(inv.ppn) || 0,
                                totalTagihan: Number(inv.total_tagihan) || 0,
                                status: inv.status || 'Belum Lunas'
                            })));
                        }
                    } catch (err) {
                        console.error("Error loading purchase data:", err.message);
                    }
                }
                fetchPurchaseModuleData();
            }, []);

            const [form, setForm] = useState({
                pbfName: '',
                invoiceNo: '',
                date: new Date().toISOString().split('T')[0],
                dueDate: '',
                salesman: '',
                term: '30 Hari',
                totalDiscountPercent: 0,
                usePpn: true,
                items: []
            });

            const calculateDueDate = (invoiceDate, termVal) => {
                if (!invoiceDate) return '';
                const dateObj = new Date(invoiceDate);
                let daysToAdd = 30;
                if (termVal === 'Cash / COD') daysToAdd = 0;
                else if (termVal === '14 Hari') daysToAdd = 14;
                else if (termVal === '30 Hari') daysToAdd = 30;
                else if (termVal === '60 Hari') daysToAdd = 60;
                dateObj.setDate(dateObj.getDate() + daysToAdd);
                return dateObj.toISOString().split('T')[0];
            };

            const handleDateChange = (newDate) => {
                setForm(prev => ({ ...prev, date: newDate, dueDate: calculateDueDate(newDate, prev.term) }));
            };

            const handleTermChange = (newTerm) => {
                setForm(prev => ({ ...prev, term: newTerm, dueDate: calculateDueDate(prev.date, newTerm) }));
            };

            const [currentItem, setCurrentItem] = useState({
                medId: '',
                name: '',
                qty: 1,
                unit: '',
                batchNo: '',
                expDate: '',
                price: 0,
                disc: 0
            });

            const [showSupplierDropdown, setShowSupplierDropdown] = useState(false);
            const [showMedicineDropdown, setShowMedicineDropdown] = useState(false);

            const filteredInvoices = (purchaseInvoices || []).filter(inv =>
                (inv.pbfName || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                (inv.invoiceNo || '').toLowerCase().includes(searchQuery.toLowerCase())
            );

            const filteredSuppliers = suppliersList.filter(s =>
                s.name.toLowerCase().includes((form.pbfName || '').toLowerCase())
            );

            const filteredMasterPrices = masterPriceList.filter(m =>
                m.name.toLowerCase().includes(currentItem.name.toLowerCase())
            );

            const handleOpenAdd = () => {
                setEditId(null);
                const today = new Date().toISOString().split('T')[0];
                setForm({
                    pbfName: '',
                    invoiceNo: '',
                    date: today,
                    dueDate: calculateDueDate(today, '30 Hari'),
                    salesman: '',
                    term: '30 Hari',
                    totalDiscountPercent: 0,
                    usePpn: true,
                    items: []
                });
                setCurrentItem({ medId: '', name: '', qty: 1, unit: '', batchNo: '', expDate: '', price: 0, disc: 0 });
                setIsModalOpen(true);
            };

            const handleOpenEdit = (inv) => {
                setEditId(inv.id);
                setForm({ 
                    ...inv, 
                    totalDiscountPercent: inv.totalDiscountPercent || 0,
                    usePpn: inv.usePpn !== undefined ? inv.usePpn : true 
                });
                setIsModalOpen(true);
            };

            const handleDelete = async (id) => {
                if (window.confirm(`Hapus data faktur pembelian #${id}?`)) {
                    setPurchaseInvoices(prev => prev.filter(inv => inv.id !== id));
                    if (addAuditLog) addAuditLog('Pembelian', `Menghapus faktur pembelian #${id}`);
                    if (supabaseClient) {
                        await supabaseClient.from('purchase_invoices').delete().eq('id', id);
                    }
                }
            };

            const handleAddItemToInvoice = () => {
                if (!currentItem.name || !currentItem.medId) {
                    alert("Pilih obat terlebih dahulu dari Master Price!");
                    return;
                }
                const qtyNum = Number(currentItem.qty) || 1;
                const priceNum = Number(currentItem.price) || 0;
                const discNum = Number(currentItem.disc) || 0;
                const subtotal = (qtyNum * priceNum) - ((qtyNum * priceNum * discNum) / 100);
                
                setForm(prev => ({
                    ...prev,
                    items: [...prev.items, { ...currentItem, qty: qtyNum, price: priceNum, disc: discNum, subtotal: Math.round(subtotal) }]
                }));
                setCurrentItem({ medId: '', name: '', qty: 1, unit: '', batchNo: '', expDate: '', price: 0, disc: 0 });
            };

            const handleRemoveItem = (index) => {
                setForm(prev => ({ ...prev, items: prev.items.filter((_, idx) => idx !== index) }));
            };

            const grossDpp = form.items.reduce((acc, it) => acc + (Number(it.subtotal) || 0), 0);
            const totalDiscountAmount = Math.round(grossDpp * ((Number(form.totalDiscountPercent) || 0) / 100));
            const netDpp = grossDpp - totalDiscountAmount;
            const ppnTotal = form.usePpn ? Math.round(netDpp * 0.11) : 0;
            const grandTotalTagihan = netDpp + ppnTotal;

            const handleSaveInvoice = async (e) => {
                e.preventDefault();
                if (form.items.length === 0) {
                    alert("Faktur minimal harus memiliki 1 item obat!");
                    return;
                }

                const newInvoiceRecord = {
                    id: editId || `INV-PBF-${Date.now().toString().slice(-6)}`,
                    ...form,
                    dpp: netDpp,
                    grossDpp: grossDpp,
                    totalDiscountAmount: totalDiscountAmount,
                    ppn: ppnTotal,
                    totalTagihan: grandTotalTagihan,
                    status: 'Belum Lunas'
                };

                if (editId) {
                    setPurchaseInvoices(prev => prev.map(inv => inv.id === editId ? newInvoiceRecord : inv));
                    if (addAuditLog) addAuditLog('Pembelian', `Memperbarui faktur PBF: ${newInvoiceRecord.invoiceNo}`);
                } else {
                    setPurchaseInvoices(prev => [newInvoiceRecord, ...prev]);
                    if (addAuditLog) addAuditLog('Pembelian', `Menambahkan faktur PBF baru: ${newInvoiceRecord.invoiceNo}`);
                }

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('purchase_invoices').upsert([{
                            id: newInvoiceRecord.id,
                            pbf_name: newInvoiceRecord.pbfName,
                            invoice_no: newInvoiceRecord.invoiceNo,
                            tanggal_faktur: newInvoiceRecord.date,
                            tanggal_tempo: newInvoiceRecord.dueDate,
                            salesman: newInvoiceRecord.salesman,
                            term: newInvoiceRecord.term,
                            use_ppn: newInvoiceRecord.usePpn,
                            items: JSON.stringify(newInvoiceRecord.items),
                            dpp: newInvoiceRecord.dpp,
                            gross_dpp: newInvoiceRecord.grossDpp,
                            total_discount_amount: newInvoiceRecord.totalDiscountAmount,
                            ppn: newInvoiceRecord.ppn,
                            total_tagihan: newInvoiceRecord.totalTagihan,
                            status: newInvoiceRecord.status
                        }]);
                    } catch (err) {
                        console.error("Gagal simpan ke Supabase:", err.message);
                    }
                }

                setIsModalOpen(false);
            };

            return (
                <div className="space-y-4 text-xs">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 className="font-black text-slate-800 text-sm">Pembelian & Penerimaan Faktur PBF</h3>
                            <p className="text-[10px] text-slate-500 mt-0.5">Kelola faktur pembelian dari supplier Supabase.</p>
                        </div>
                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <div className="relative flex-1 md:w-64">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-[10px]"></i>
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}

                                    className="w-full pl-8 pr-3 py-1.5 border rounded-lg text-xs bg-slate-50 focus:bg-white font-medium"
                                />
                            </div>
                            <button onClick={handleOpenAdd} className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs shadow-xs transition flex items-center gap-1.5">
                                <i className="fa-solid fa-plus"></i> + Faktur Pembelian
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 border-b font-bold uppercase text-[11px] text-slate-600">
                                <tr>
                                    <th className="p-3">No. Faktur & PBF</th>
                                    <th className="p-3">Tanggal & Tempo</th>
                                    <th className="p-3 text-center">Jumlah Item</th>
                                    <th className="p-3 text-right">Total Tagihan (PPN)</th>
                                    <th className="p-3 text-center">Status</th>
                                    <th className="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredInvoices.map(inv => (
                                    <tr key={inv.id} className="hover:bg-slate-50">
                                        <td className="p-3">
                                            <span className="font-mono font-bold text-indigo-700 block">{inv.invoiceNo}</span>
                                            <span className="text-[10px] font-bold text-slate-700">{inv.pbfName}</span>
                                        </td>
                                        <td className="p-3">
                                            <span className="block text-slate-800">Tgl: {inv.date}</span>
                                            <span className="text-[10px] text-rose-600 font-bold">Tempo: {inv.dueDate}</span>
                                        </td>
                                        <td className="p-3 text-center">
                                            <span className="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-black rounded-lg text-xs">
                                                {inv.items.length} Item
                                            </span>
                                        </td>
                                        <td className="p-3 text-right font-mono font-bold text-slate-900">
                                            Rp {inv.totalTagihan.toLocaleString()}
                                            <span className="block text-[9px] text-slate-500 font-normal">{inv.usePpn ? '+PPN 11%' : 'Termasuk PPN'}</span>
                                        </td>
                                        <td className="p-3 text-center">
                                            <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] ${inv.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                {inv.status}
                                            </span>

                                        <td className="p-3 text-center space-x-1.5">
                                            <button onClick={() => handleOpenEdit(inv)} className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-[10px]" title="Edit">
                                                <i className="fa-solid fa-pen-to-square"></i>
                                            </button>
                                            <button onClick={() => handleDelete(inv.id)} className="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px]" title="Hapus">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
