                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // 4. INVENTORY VIEW (Master Price List & Batch FEFO)
        function InventoryView({ medicines, setMedicines, unitsList, addAuditLog }) { 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editId, setEditId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [showTieredPricing, setShowTieredPricing] = useState(false);

            const [form, setForm] = useState({
                name: '',
                category: 'Obat Bebas',
                satuanBesar: 'Box',
                satuanKecil: 'Strip',
                rasioKonversi: 10,
                hnaBesar: 50000,
                markupPercent: 100,
                minStock: 10,
                maxStock: 100,
                batchNo: '',
                stock: 50,
                expDate: '2028-01-01',
                supplier: 'PT Kimia Farma Trading',
                tieredConfig: {
                    terkecil: {
                        pasien: { active: false, markup: 90 },
                        mitra: { active: false, markup: 80 }
                    },
                    besar: {
                        pasien: { active: false, markup: 90 },
                        mitra: { active: false, markup: 80 }
                    }
                }
            });

            useEffect(() => {
                let isMounted = true;
                async function fetchSupabaseMasterPrice() {
                    if (!supabaseClient) return;
                    try {
                        const { data, error } = await supabaseClient.from('master_price').select('*');
                        if (error) throw error;
                        if (data && data.length > 0 && isMounted) {
                            const mapped = data.map(item => ({
                                id: item.id || Date.now(),
                                name: item.nama_obat || 'Tanpa Nama',
                                unit: item.satuan || 'Strip',
                                satuanBesar: item.satuan_besar || 'Box',
                                satuanKecil: item.satuan || 'Strip',
                                rasioKonversi: Number(item.rasio_konversi || item.konversi) || 10,
                                hnaBesar: Number(item.hna) || 0,
                                hpp: Number(item.hpp) || 0,
                                sellPrice: Number(item.sales_price) || 0,
                                sellPriceKlinik: Number(item.harga_klinik || item.sellPriceKlinik) || Math.round((Number(item.sales_price) || 0) * 0.95),
                                sellPriceMitra: Number(item.harga_mitra || item.sellPriceMitra) || Math.round((Number(item.sales_price) || 0) * 0.90),
                                stock: Number(item.stok) || 0,
                                minStock: 10,
                                maxStock: 100,
                                batchNo: item.batch_no || 'BTC-SYNC',
                                expDate: item.exp_date || '2028-01-01',
                                isTieredActive: item.is_tiered_active || false,
                                tieredConfig: item.tiered_config ? (typeof item.tiered_config === 'string' ? JSON.parse(item.tiered_config) : item.tiered_config) : {
                                    terkecil: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } },
                                    besar: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } }
                                }
                            }));
                            setMedicines(mapped);
                        }
                    } catch (err) {
                        console.error("Gagal memuat master_price dari Supabase:", err.message);
                    }
                }
                fetchSupabaseMasterPrice();
                return () => { isMounted = false; };
            }, []);

            const parseNum = (val) => {
                if (val === '' || val === null || val === undefined) return 0;
                const n = Number(val);
                return isNaN(n) ? 0 : n;
            };

            const hnaBesarVal = parseNum(form.hnaBesar);
            const markupDasarVal = parseNum(form.markupPercent);
            const rasioVal = parseNum(form.rasioKonversi) || 1;

            const hppBesar = Math.round(hnaBesarVal * 1.11);
            const salesPriceBesar = Math.round(hppBesar + (hppBesar * (markupDasarVal / 100)));
            
            const hnaKecil = rasioVal > 0 ? hnaBesarVal / rasioVal : hnaBesarVal;
            const hppKecil = Math.round(hnaKecil * 1.11);
            const salesPriceKecil = rasioVal > 0 ? Math.round(salesPriceBesar / rasioVal) : salesPriceBesar;

            const markupMitraKecil = form.tieredConfig?.terkecil?.mitra?.active ? parseNum(form.tieredConfig.terkecil.mitra.markup) : markupDasarVal;
            const sellPriceMitraKecil = Math.round(hppKecil + (hppKecil * (markupMitraKecil / 100)));

            const handleOpenAdd = () => {
                setEditId(null);
                setShowTieredPricing(false);
                setForm({
                    name: '',
                    category: 'Obat Bebas',
                    satuanBesar: 'Box',
                    satuanKecil: 'Strip',
                    rasioKonversi: 10,
                    hnaBesar: 50000,
                    markupPercent: 100,
                    minStock: 10,
                    maxStock: 100,
                    batchNo: `BTC-${new Date().getFullYear()}A`,
                    stock: 50,
                    expDate: '2028-01-01',
                    supplier: 'PT Kimia Farma Trading',
                    tieredConfig: {
                        terkecil: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } },
                        besar: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } }
                    }
                });
                setIsModalOpen(true);
            };

            const handleOpenEdit = (m) => {
                setEditId(m.id);
                setShowTieredPricing(m.isTieredActive || false);
                setForm({
                    name: m.name || '',
                    category: m.category || 'Obat Bebas',
                    satuanBesar: m.satuanBesar || 'Box',
                    satuanKecil: m.satuanKecil || m.unit || 'Strip',
                    rasioKonversi: m.rasioKonversi || 10,
                    hnaBesar: m.hnaBesar || 50000,
                    markupPercent: m.markupPercent || 100,
                    minStock: m.minStock || 10,
                    maxStock: m.maxStock || 100,
                    batchNo: m.batchNo || 'BTC-001',
                    stock: m.stock || 0,
                    expDate: m.expDate || '2028-01-01',
                    supplier: m.supplier || 'PT Kimia Farma Trading',
                    tieredConfig: m.tieredConfig || {
                        terkecil: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } },
                        besar: { pasien: { active: false, markup: 90 }, mitra: { active: false, markup: 80 } }
                    }
                });
                setIsModalOpen(true);
            };

            const handleDelete = async (id, name) => {
                if (window.confirm(`Apakah Anda yakin ingin menghapus obat "${name}"?`)) {
                    setMedicines(Array.isArray(medicines) ? medicines.filter(m => m.id !== id) : []);
                    if (addAuditLog) addAuditLog('Inventori', `Menghapus obat: ${name}`);

                    if (supabaseClient) {
                        await supabaseClient.from('master_price').delete().eq('id', id);
                    }
                }
            };

            const handleSave = async (e) => {
                e.preventDefault();

                const recordId = editId ? editId : `MED-${Date.now()}`;

                const payload = {
                    id: recordId,
                    name: form.name,
                    category: form.category,
                    unit: form.satuanKecil,
                    satuanBesar: form.satuanBesar,
                    satuanKecil: form.satuanKecil,
                    rasioKonversi: rasioVal,
                    hnaBesar: hnaBesarVal,
                    markupPercent: markupDasarVal,
                    hpp: hppBesar,
                    sellPrice: salesPriceKecil,
                    sellPriceKlinik: Math.round(salesPriceKecil * 0.95),
                    sellPriceMitra: sellPriceMitraKecil,
                    stock: parseNum(form.stock),
                    minStock: parseNum(form.minStock),
                    batchNo: form.batchNo || '',
                    expDate: form.expDate || null,
                    isTieredActive: showTieredPricing,
                    tieredConfig: form.tieredConfig
                };

                if (supabaseClient) {
                    try {
                        const dbRecord = {
                            id: recordId,
                            nama_obat: payload.name,
                            satuan: payload.satuanKecil,
                            satuan_besar: payload.satuanBesar,
                            rasio_konversi: payload.rasioKonversi,
                            hna: payload.hnaBesar,
                            hpp: payload.hpp,
                            sales_price: payload.sellPrice,
                            harga_klinik: payload.sellPriceKlinik,
                            harga_mitra: payload.sellPriceMitra,
                            stok: payload.stock,
                            is_tiered_active: payload.isTieredActive,
                            tiered_config: JSON.stringify(payload.tieredConfig)
                        };

                        const { error } = await supabaseClient
                            .from('master_price')
                            .upsert([dbRecord], { onConflict: ['id'] });

                        if (error) {
                            console.error("Gagal simpan ke Supabase:", error.message);
                            alert("GAGAL MENYIMPAN KE SUPABASE: " + error.message);
                            return; 
                        }
                    } catch (err) {
                        console.error("Error Koneksi Supabase:", err.message);
                        alert("Terjadi kesalahan koneksi ke Supabase: " + err.message);
                        return;
                    }
                }

                let updatedList = [];
                if (editId) {
                    updatedList = medicines.map(item => item.id === editId ? { ...payload, id: editId } : item);
                } else {
                    updatedList = [payload, ...medicines];
                }
                
                if (setMedicines) setMedicines(updatedList);
                setIsModalOpen(false);
            };

            const filteredMedicines = medicines.filter(m => 
                (m?.name || '').toLowerCase().includes((searchQuery || '').toLowerCase()) ||
                ((m?.category || '').toLowerCase().includes((searchQuery || '').toLowerCase()))
            );

            return (
                <div className="space-y-3 text-xs">
                    <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 className="font-black text-slate-800 text-sm">Master Price List & Batch (FEFO - Supabase Sync)</h3>
                            <p className="text-[10px] text-slate-500 mt-0.5">Pengaturan harga dasar, harga khusus mitra/klinik, dan integrasi stok Supabase.</p>
                        </div>
                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <div className="relative flex-1 md:w-60">
                                <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-[10px]"></i>
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Cari nama obat..." 
                                    className="w-full pl-8 pr-3 py-1.5 border rounded-xl text-xs bg-slate-50 focus:bg-white font-medium outline-none"
                                />
                            </div>
                            <button onClick={handleOpenAdd} className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shadow-md transition flex items-center gap-1.5">
                                <i className="fa-solid fa-plus"></i> Tambah Obat
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-[11px]">
                            <thead className="bg-slate-50 border-b font-bold uppercase text-[10px] text-slate-600">
                                <tr>
                                    <th className="p-3">Nama Obat</th>
                                    <th className="p-3">Satuan</th>
                                    <th className="p-3 text-center">Konversi</th>
                                    <th className="p-3 text-right">HNA</th>
                                    <th className="p-3 text-right">HPP</th>
                                    <th className="p-3 text-right">Harga Reguler</th>
                                    <th className="p-3 text-right text-emerald-700">Harga Mitra</th>
                                    <th className="p-3 text-center">Stok</th>
                                    <th className="p-3 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredMedicines.map(m => (
                                    <tr key={m.id} className="hover:bg-slate-50 transition">
                                        <td className="p-3 font-bold text-slate-800">{m.name}</td>
                                        <td className="p-3">{m.satuanBesar || 'Box'} / {m.satuanKecil || m.unit}</td>
                                        <td className="p-3 text-center font-mono font-bold text-indigo-700">
                                            1 : {m.rasioKonversi || 10}
                                        </td>
                                        <td className="p-3 text-right font-mono text-slate-600">Rp {(m.hnaBesar || 0).toLocaleString()}</td>
                                        <td className="p-3 text-right font-mono font-bold text-amber-700">Rp {(m.hpp || 0).toLocaleString()}</td>
                                        <td className="p-3 text-right font-mono font-bold text-indigo-700">Rp {(m.sellPrice || 0).toLocaleString()}</td>
                                        <td className="p-3 text-right font-mono font-bold text-emerald-700">Rp {(m.sellPriceMitra || m.sellPrice || 0).toLocaleString()}</td>
                                        <td className="p-3 text-center font-black text-emerald-700">{m.stock} {m.unit}</td>
                                        <td className="p-3 text-center space-x-1.5">
                                            <button onClick={() => handleOpenEdit(m)} className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-[10px]" title="Edit">
                                                <i className="fa-solid fa-pen-to-square"></i>
                                            </button>
                                            <button onClick={() => handleDelete(m.id, m.name)} className="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px]" title="Hapus">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* MODAL FORM EDIT / TAMBAH OBAT */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center z-50 p-4 overflow-y-auto">
                            <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden border my-6">
                                <div className="px-6 py-4 bg-slate-900 text-white flex justify-between items-center sticky top-0 z-10">
                                    <h3 className="font-black text-xs uppercase tracking-wider">{editId ? 'Edit Master Data Obat' : 'Tambah Obat Baru'}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-sm"></i></button>
                                </div>

                                <form onSubmit={handleSave} className="p-6 space-y-4 text-[11px] max-h-[80vh] overflow-y-auto custom-scrollbar">
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold mb-1 text-slate-700">Nama Obat *</label>
                                            <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} required className="w-full p-2 border rounded-xl font-bold bg-white" placeholder="Contoh: Paracetamol 500mg" />
                                        </div>
                                        <div>
                                            <label className="block font-bold mb-1 text-slate-700">Kategori / Golongan *</label>
                                            <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-white">
                                                <option value="Obat Bebas">Obat Bebas</option>
                                                <option value="Obat Bebas Terbatas">Obat Bebas Terbatas</option>
                                                <option value="Obat Keras">Obat Keras</option>
                                                <option value="Alat Kesehatan">Alat Kesehatan</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="p-3.5 border rounded-2xl bg-white shadow-xs space-y-2">
                                        <h4 className="font-black text-slate-800 uppercase tracking-wider text-[10px]">Aturan Satuan & Konversi</h4>
                                        <div className="grid grid-cols-3 gap-2">
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Satuan Besar</label>
                                                <input type="text" value={form.satuanBesar} onChange={e => setForm({...form, satuanBesar: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Satuan Kecil</label>
                                                <input type="text" value={form.satuanKecil} onChange={e => setForm({...form, satuanKecil: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Rasio Konversi</label>
                                                <input type="number" value={form.rasioKonversi} onChange={e => setForm({...form, rasioKonversi: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-white text-indigo-700" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-3.5 border rounded-2xl bg-slate-50 space-y-2">
                                        <h4 className="font-black text-slate-800 uppercase tracking-wider text-[10px]">Pengaturan Harga Dasar & Skema Mitra</h4>
                                        <div className="grid grid-cols-4 gap-2">
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">HNA ({form.satuanBesar})</label>
                                                <input type="number" value={form.hnaBesar} onChange={e => setForm({...form, hnaBesar: e.target.value})} className="w-full p-2 border rounded-xl font-bold bg-white text-indigo-700" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">HPP (+11%)</label>
                                                <input type="text" readOnly value={`Rp ${hppBesar.toLocaleString()}`} className="w-full p-2 border rounded-xl font-bold bg-slate-200 text-amber-700" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Jual Reguler</label>
                                                <input type="text" readOnly value={`Rp ${salesPriceKecil.toLocaleString()}`} className="w-full p-2 border rounded-xl font-black bg-indigo-50 text-indigo-900" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Harga Mitra (Khusus)</label>
                                                <input type="text" readOnly value={`Rp ${sellPriceMitraKecil.toLocaleString()}`} className="w-full p-2 border rounded-xl font-black bg-emerald-50 text-emerald-800" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-3.5 border rounded-2xl bg-slate-50 space-y-2">
                                        <h4 className="font-extrabold text-slate-800 border-b pb-1 text-[10px]">Informasi Stok & Batch FEFO</h4>
                                        <div className="grid grid-cols-3 gap-2">
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Stok Awal *</label>
                                                <input type="number" value={form.stock} onChange={e => setForm({...form, stock: e.target.value})} required className="w-full p-2 border rounded-xl font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">No. Batch *</label>
                                                <input type="text" value={form.batchNo} onChange={e => setForm({...form, batchNo: e.target.value})} required className="w-full p-2 border rounded-xl font-bold bg-white" />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-slate-600 mb-0.5">Expired Date *</label>
                                                <input type="date" value={form.expDate} onChange={e => setForm({...form, expDate: e.target.value})} required className="w-full p-2 border rounded-xl font-bold bg-white" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pt-3 flex justify-end gap-2 border-t sticky bottom-0 bg-white py-2">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black shadow-md">Simpan Data Obat</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 5. STOCK CARD VIEW
        function StockCardView({ medicines, stockMutations }) {
            const [selectedMedId, setSelectedMedId] = useState(medicines[0]?.id || '');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');

            const selectedMedicine = medicines.find(m => m.id === selectedMedId) || medicines[0];

            const filteredMutations = useMemo(() => {
                return stockMutations.filter(m => {
                    if (m.medicineId !== selectedMedId) return false;
                    if (startDate && m.date < startDate) return false;
                    if (endDate && m.date > endDate) return false;
                    return true;
                });
            }, [stockMutations, selectedMedId, startDate, endDate]);

            return (
                <div className="space-y-4">
                    <div className="flex flex-wrap justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-xs gap-3 no-print">
                        <h3 className="font-black text-slate-800 text-sm">Kartu Stok Resmi Obat</h3>
                        
                        <div className="flex flex-wrap items-center gap-3 text-xs font-bold">
                            <div>
                                <label className="block text-[10px] text-slate-500 uppercase">Pilih Obat</label>
                                <select 
                                    value={selectedMedId} 
                                    onChange={e => setSelectedMedId(e.target.value)} 
                                    className="p-2 border rounded-xl bg-white text-slate-800"
                                >
                                    {medicines.map(m => (<option key={m.id} value={m.id}>{m.name}</option>))}
                                </select>
                            </div>

                            <button onClick={() => window.print()} className="mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition flex items-center gap-2">
                                <i className="fa-solid fa-print"></i> Cetak Kartu Stok
                            </button>
                        </div>
                    </div>

                    <div id="printable-modal" className="bg-white p-6 rounded-2xl border shadow-xs space-y-4">
                        <div className="text-center border-b pb-4">
                            <h2 className="font-black text-lg text-slate-900 uppercase">Apotek Latisha Farma</h2>
                            <h4 className="font-bold text-sm text-slate-700 uppercase">Kartu Stok Obat</h4>
                            <p className="text-xs text-slate-500 font-semibold mt-1">
                                Nama Obat: <strong className="text-slate-800">{selectedMedicine?.name}</strong> | Batch: <strong className="text-slate-800">{selectedMedicine?.batchNo}</strong>
                            </p>
                        </div>

                        <table className="w-full text-left text-xs border border-collapse">
                            <thead className="bg-slate-100 border-b font-bold uppercase text-[11px]">
                                <tr>
                                    <th className="p-2 border">Tanggal</th>
                                    <th className="p-2 border">No. Ref</th>
                                    <th className="p-2 border">Keterangan</th>
                                    <th className="p-2 border text-center w-20">Masuk</th>
                                    <th className="p-2 border text-center w-20">Keluar</th>
                                    <th className="p-2 border text-center w-20">Sisa Stok</th>
                                    <th className="p-2 border">Petugas</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredMutations.map((mut, i) => (
                                    <tr key={i} className="border-b hover:bg-slate-50">
                                        <td className="p-2 border font-mono">{mut.date}</td>
                                        <td className="p-2 border font-mono font-bold text-indigo-700">{mut.refNo}</td>
                                        <td className="p-2 border">{mut.ket}</td>
                                        <td className="p-2 border text-center font-bold text-emerald-600">{mut.inQty > 0 ? `+${mut.inQty}` : '-'}</td>
                                        <td className="p-2 border text-center font-bold text-rose-600">{mut.outQty > 0 ? `-${mut.outQty}` : '-'}</td>
                                        <td className="p-2 border text-center font-black bg-slate-50">{mut.balance}</td>
                                        <td className="p-2 border text-slate-600">{mut.petugas || 'Admin'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // 6. DEFECTA VIEW
        function DefectaView({ medicines }) {
            const defectaList = medicines.filter(m => m.stock <= m.minStock);
            return (
                <div className="space-y-4">
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 className="font-black text-slate-800 text-sm">Defecta & Re-Order Generator</h3>
                    </div>
                    <div className="bg-white rounded-2xl border overflow-hidden">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 border-b font-bold uppercase">
                                <tr>
                                    <th className="p-3">Obat</th>
                                    <th className="p-3">Sisa Stok</th>
                                    <th className="p-3">Buffer Min</th>
                                    <th className="p-3 text-rose-600 font-black">Rekomendasi Re-order</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {defectaList.map(o => (
                                    <tr key={o.id}>
                                        <td className="p-3 font-bold">{o.name}</td>
                                        <td className="p-3 font-black text-rose-600">{o.stock} {o.unit}</td>
                                        <td className="p-3">{o.minStock} {o.unit}</td>
                                        <td className="p-3 font-black text-indigo-700">+{(o.minStock * 2) - o.stock} {o.unit}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }
		
        // --- SUBMENU MODUL SETUP ---
        function SetupPegawaiView({ employees, setEmployees, addAuditLog }) {
            const [form, setForm] = useState({ name: '', role: 'Apoteker', phone: '', status: 'Aktif' });
            const [editId, setEditId] = useState(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!form.name || !form.phone) return;

                if (editId) {
                    if (supabaseClient) await supabaseClient.from('pegawai').update(form).eq('id', editId);
                    setEmployees(employees.map(emp => emp.id === editId ? { ...emp, ...form } : emp));
                    setEditId(null);
                } else {
                    const newId = `EMP-00${employees.length + 1}`;
                    const newEmp = { id: newId, ...form };
                    if (supabaseClient) await supabaseClient.from('pegawai').insert([newEmp]);
                    setEmployees([...employees, newEmp]);
                }
                setForm({ name: '', role: 'Apoteker', phone: '', status: 'Aktif' });
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
                        <h3 className="font-black text-slate-800 text-sm mb-3">{editId ? 'Edit Data Pegawai' : 'Tambah Pegawai Baru'}</h3>
                        <form onSubmit={handleSubmit} className="grid grid-cols-5 gap-3 items-end">
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Lengkap</label>
                                <input type="text" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} required className="w-full p-2 border rounded-xl font-bold text-xs bg-white" />
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Jabatan / Role</label>
                                <select value={form.role} onChange={e=>setForm({...form, role: e.target.value})} className="w-full p-2 border rounded-xl font-bold text-xs bg-white">
                                    <option value="Super Admin / APJ">Super Admin / APJ</option>
                                    <option value="Apoteker">Apoteker</option>
                                    <option value="Kasir POS">Kasir POS</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">No. Telepon</label>
                                <input type="text" value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} required className="w-full p-2 border rounded-xl font-bold text-xs bg-white" />
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Status</label>
                                <select value={form.status} onChange={e=>setForm({...form, status: e.target.value})} className="w-full p-2 border rounded-xl font-bold text-xs bg-white">
                                    <option value="Aktif">Aktif</option>
                                    <option value="Non-Aktif">Non-Aktif</option>
                                </select>
                            </div>
                            <div className="flex gap-2">
                                <button type="submit" className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl text-xs shadow-md">Simpan</button>
                            </div>
                        </form>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 border-b text-slate-600 font-bold uppercase">
                                <tr>
                                    <th className="p-3">ID Pegawai</th>
                                    <th className="p-3">Nama Lengkap</th>
                                    <th className="p-3">Role</th>
                                    <th className="p-3">Telepon</th>
                                    <th className="p-3">Status</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {employees.map(emp => (
                                    <tr key={emp.id} className="hover:bg-slate-50">
                                        <td className="p-3 font-mono font-bold text-indigo-700">{emp.id}</td>
                                        <td className="p-3 font-bold text-slate-800">{emp.name}</td>
                                        <td className="p-3">{emp.role}</td>
                                        <td className="p-3 font-mono">{emp.phone}</td>
                                        <td className="p-3"><span className="px-2 py-0.5 rounded-full font-bold text-[10px] bg-emerald-100 text-emerald-800">{emp.status}</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function SetupRoleView({ rolesList }) {
            return (
                <div className="bg-white p-5 rounded-2xl border shadow-xs space-y-4 text-xs">
                    <h3 className="font-black text-slate-800 text-sm">Hak Akses Modul</h3>
                    <div className="grid grid-cols-2 gap-4">
                        {rolesList.map(r => (
                            <div key={r.id} className="p-4 border rounded-2xl bg-slate-50 space-y-2">
                                <h4 className="font-extrabold text-indigo-900 text-sm">{r.name}</h4>
                                <p className="text-slate-500">{r.desc}</p>
                                <div className="flex flex-wrap gap-1 pt-2">
                                    {r.access.map(a => (<span key={a} className="px-2 py-1 bg-white border text-indigo-700 font-bold rounded-lg text-[10px]">{a}</span>))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SetupKategoriPelangganView({ custCategories }) {
            return (
                <div className="bg-white rounded-2xl border shadow-xs overflow-hidden text-xs">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b font-bold uppercase">
                            <tr>
                                <th className="p-3">ID</th>
                                <th className="p-3">Kategori Pelanggan</th>
                                <th className="p-3">Diskon</th>
                                <th className="p-3">Deskripsi</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {custCategories.map(c => (
                                <tr key={c.id}>
                                    <td className="p-3 font-mono font-bold text-indigo-700">{c.id}</td>
                                    <td className="p-3 font-bold">{c.name}</td>
                                    <td className="p-3 font-mono font-bold text-emerald-600">{c.discount}</td>
                                    <td className="p-3 text-slate-600">{c.desc}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function SetupKategoriProdukView({ prodCategories }) {
            return (
                <div className="bg-white rounded-2xl border shadow-xs overflow-hidden text-xs">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b font-bold uppercase">
                            <tr>
                                <th className="p-3">ID</th>
                                <th className="p-3">Kategori Produk</th>
                                <th className="p-3">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {prodCategories.map(p => (
                                <tr key={p.id}>
                                    <td className="p-3 font-mono font-bold text-indigo-700">{p.id}</td>
                                    <td className="p-3 font-bold">{p.name}</td>
                                    <td className="p-3 text-slate-600">{p.desc}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function SetupSatuanView({ unitsList }) {
            return (
                <div className="bg-white rounded-2xl border shadow-xs overflow-hidden text-xs">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b font-bold uppercase">
                            <tr>
                                <th className="p-3">ID</th>
                                <th className="p-3">Satuan Besar</th>
                                <th className="p-3">Satuan Kecil</th>
                                <th className="p-3 text-center">Konversi</th>
                                <th className="p-3">Keterangan Aturan</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {unitsList.map(u => (
                                <tr key={u.id}>
                                    <td className="p-3 font-mono font-bold text-indigo-700">{u.id}</td>
                                    <td className="p-3 font-bold">{u.largeUnit}</td>
                                    <td className="p-3 font-bold">{u.smallUnit}</td>
                                    <td className="p-3 text-center font-black text-emerald-600">{u.conversion}</td>
                                    <td className="p-3 text-slate-600">{u.desc}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function DoctorCommissionView({ doctors }) {
            return (
                <div className="bg-white rounded-2xl border overflow-hidden text-xs">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b font-bold uppercase">
                            <tr>
                                <th className="p-3">Nama Dokter</th>
                                <th className="p-3">SIP</th>
                                <th className="p-3">Skema Komisi</th>
                                <th className="p-3 text-right">Akumulasi Komisi</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {doctors.map(d => (
                                <tr key={d.id}>
                                    <td className="p-3 font-bold">{d.name}</td>
                                    <td className="p-3 font-mono">{d.sip}</td>
                                    <td className="p-3">{d.commissionValue}% dari Jasa Resep</td>
                                    <td className="p-3 text-right font-mono font-black text-emerald-600">Rp {d.earnedCommission.toLocaleString()}</td>
                                </tr>
                            ))}
                        </tbody>

                </div>

        }

        function AuditTrailView({ auditLogs }) {
            return (
                <div className="bg-white rounded-2xl border overflow-hidden text-xs">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 border-b font-bold uppercase">
                            <tr>
                                <th className="p-3">Waktu</th>
                                <th className="p-3">Role</th>
                                <th className="p-3">Modul</th>
                                <th className="p-3">Aktivitas Log</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {auditLogs.map((log, idx) => (
                                <tr key={idx}>
                                    <td className="p-3 font-mono text-[10px]">{log.time}</td>
                                    <td className="p-3 font-bold text-indigo-700">{log.role}</td>
                                    <td className="p-3 font-semibold">{log.module}</td>
                                    <td className="p-3">{log.detail}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
